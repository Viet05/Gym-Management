<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Gym Management</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="logo">
                <span>💪</span> GymAdmin
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="#" class="nav-link active">
                        <span>User Management</span>
                    </a>
                </li>
            </ul>
            <div class="user-profile" style="margin-top: auto;">
                <div class="avatar">A</div>
                <div>
                    <div style="font-weight: 600">Admin</div>
                    <div style="font-size: 0.75rem; color: var(--text-muted)">Administrator</div>
                </div>
                <button id="logoutBtn" class="btn btn-sm"
                    style="margin-left: auto; background: none; color: var(--danger)">Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="header">
                <h1 class="page-title">User Management</h1>
                <button id="toggleFormBtn" class="btn btn-primary" onclick="toggleUserForm()">+ Add User</button>
            </div>

            <!-- Inline User Form (Hidden by default) -->
            <div id="userFormSection" class="card hidden"
                style="background: var(--card-bg); padding: 2rem; border-radius: 1rem; margin-bottom: 2rem; border: var(--glass-border);">
                <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem;">
                    <h2 id="formTitle">Add User</h2>
                    <button class="btn btn-sm" style="background: transparent; color: var(--text-muted);"
                        onclick="toggleUserForm()">Close</button>
                </div>
                <form id="userForm">
                    <input type="hidden" id="userId">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                        <div class="form-group">
                            <label class="form-label">Username</label>
                            <input type="text" class="form-input" id="user-username" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-input" id="user-password">
                            <small style="color: var(--text-muted)">Leave blank to keep unchanged (Edit mode)</small>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-input" id="user-fullname" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-input" id="user-email" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Phone</label>
                            <input type="tel" class="form-input" id="user-phone">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Role</label>
                            <select id="user-role" class="form-input">
                                <option value="USER">User</option>
                                <option value="ADMIN">Admin</option>
                                <option value="TRAINER">Trainer</option>
                            </select>
                        </div>
                        <div class="form-group" id="statusGroup">
                            <label class="form-label">Status</label>
                            <select id="user-status" class="form-input">
                                <option value="ACTIVE">Active</option>
                                <option value="INACTIVE">Inactive</option>
                            </select>
                        </div>
                    </div>
                    <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem;">
                        <button type="button" class="btn"
                            style="background: transparent; border: 1px solid var(--border-color); color: var(--text-color)"
                            onclick="toggleUserForm()">Cancel</button>
                        <button type="submit" class="btn btn-primary">Save User</button>
                    </div>
                </form>
            </div>

            <!-- Search Section -->
            <div class="card"
                style="background: var(--card-bg); padding: 1.5rem; border-radius: 1rem; margin-bottom: 2rem; border: var(--glass-border);">
                <h3 style="margin-bottom: 1rem; font-size: 1.1rem;">Find Users</h3>
                <div
                    style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; align-items: end;">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-input" id="search-fullname" placeholder="Search by name...">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label class="form-label">Email</label>
                        <input type="text" class="form-input" id="search-email" placeholder="Search by email...">
                    </div>
                    <div>
                        <button class="btn btn-primary" onclick="searchUsers()">Search</button>
                        <button class="btn" style="background: rgba(255,255,255,0.1); margin-left: 0.5rem;"
                            onclick="resetSearch()">Reset</button>
                    </div>
                </div>
            </div>

            <!-- User Table -->
            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Full Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <!-- Users will be populated here -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
